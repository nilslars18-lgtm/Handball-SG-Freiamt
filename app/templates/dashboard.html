function hbSearchCardHtml() {
  return `<div class="card"><h2>🔎 Spiel auf handball.ch holen</h2>
    <p class="muted">Schreib z.B. <em>Spiel gegen Stans</em> – die App holt Resultat, Statistik und Liveticker und schreibt einen Entwurf.</p>
    <div style="display:flex;gap:8px"><input id="hb-q" placeholder="Spiel gegen …" style="flex:1" onkeydown="if(event.key==='Enter')hbSearch()">
      <button class="btn" style="width:auto" onclick="hbSearch()">Suchen</button></div>
    ${isAdmin() ? `<button class="btn small secondary" onclick="hbSyncAll()">🔄 Alle gespielten Spiele holen</button>` : ""}
    <div id="hb-results"></div></div>`;
}
async function hbSearch() {
  const q = document.getElementById("hb-q").value;
  const el = document.getElementById("hb-results");
  el.innerHTML = '<p class="muted">Suche auf handball.ch …</p>';
  try {
    const games = await api(`/handballch/games?q=${encodeURIComponent(q)}`);
    if (!games.length) { el.innerHTML = '<p class="muted">Kein Spiel gefunden.</p>'; return; }
    el.innerHTML = games.map(g => `<div class="list-item">
      <div class="grow"><div>${g.is_home ? "🏠" : "🚌"} ${esc(g.opponent)}</div>
        <div class="game-meta">${g.start_time ? fmtDate(g.start_time) : ""}${g.imported ? " · ✅ schon geholt" : ""}</div></div>
      ${g.played ? `${resultHtml({ us: g.us, them: g.them })}
        <button class="btn small" onclick="hbImport(${g.hb_game_id})">📥 Holen</button>` : `<span class="muted">noch nicht gespielt</span>`}
    </div>`).join("");
  } catch (e) { el.innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}
async function hbImport(hbGameId, overwrite) {
  const el = document.getElementById("hb-results") || document.getElementById("rp-result");
  if (el) el.innerHTML = '<p class="muted">Hole Daten von handball.ch …</p>';
  try {
    const r = await api(`/handballch/import/${hbGameId}${overwrite ? "?overwrite_text=true" : ""}`, { method: "POST" });
    openReport(r.game_id);
  } catch (e) { if (el) el.innerHTML = `<p class="error">${esc(e.message)}</p>`; else alert(e.message); }
}
async function hbImportForGame(gameId) {
  const el = document.getElementById("rp-result");
  if (el) el.innerHTML = '<p class="muted">Suche das Spiel auf handball.ch …</p>';
  try {
    const games = await api("/handballch/games");
    const g = games.find(x => x.app_game_id === gameId);
    if (!g) { if (el) el.innerHTML = '<p class="error">Auf handball.ch kein Spiel an diesem Tag gefunden.</p>'; return; }
    if (!g.played) { if (el) el.innerHTML = '<p class="error">Auf handball.ch ist noch kein Resultat eingetragen.</p>'; return; }
    const hasText = (document.getElementById("rp-text") || {}).value;
    const overwrite = hasText && hasText.trim() ? confirm("Es gibt schon Text im Bericht. Durch den neuen Entwurf ersetzen?\n(Abbrechen = Text behalten, nur Zahlen holen)") : false;
    await hbImport(g.hb_game_id, overwrite);
  } catch (e) { if (el) el.innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}
async function hbSyncAll() {
  const el = document.getElementById("hb-results") || document.getElementById("hb-sync-result");
  if (el) el.innerHTML = '<p class="muted">Hole alle gespielten Spiele … (kann etwas dauern)</p>';
  try {
    const r = await api("/handballch/sync", { method: "POST" });
    if (el) el.innerHTML = r.imported.length
      ? `<p class="ok">${r.imported.length} Spiele geholt: ${r.imported.map(esc).join(", ")}</p>`
      : `<p class="muted">Alles schon aktuell.</p>`;
    if (r.errors && el) el.innerHTML += `<p class="error">${r.errors} Spiele konnten nicht geholt werden.</p>`;
    if (state.tab === "statistik") renderStatistik();
  } catch (e) { if (el) el.innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}
async function loadHbTicker(gameId) {
  const box = document.getElementById("hb-ticker");
  if (!box) return;
  try {
    const d = await api(`/handballch/game/${gameId}`);
    if (!d.imported) { box.innerHTML = ""; return; }
    const goalies = (d.goalies || []).filter(g => g.saves != null).map(g => `${esc(g.name)}: ${g.saves}/${g.shots} Paraden`).join(" · ");
    box.innerHTML = `<div class="card"><h2>📡 handball.ch</h2>
      <p class="muted">Geholt am ${fmtDate(d.imported_at + "Z")} · <a href="${d.link}" target="_blank" rel="noopener">Spiel auf handball.ch öffnen</a></p>
      ${d.spectators ? `<p class="muted">👥 ${d.spectators} Zuschauer${d.referees && d.referees.length ? " · SR: " + d.referees.map(esc).join(", ") : ""}</p>` : ""}
      ${goalies ? `<p>🧤 ${goalies}</p>` : ""}
      ${d.draft ? `<details><summary class="clickable"><strong>📝 Automatischer Entwurf</strong></summary><div class="info-text">${esc(d.draft)}</div>
        <button class="btn small secondary" onclick="useDraft()">In den Bericht übernehmen</button></details>` : ""}
      <details><summary class="clickable"><strong>⏱️ Liveticker (${d.log.length})</strong></summary>
        <table style="font-size:0.8rem">${d.log.map(e => `<tr><td class="muted">${esc(e.time || "")}</td><td><strong>${esc(e.result || "")}</strong></td>
          <td>${esc(e.action || "")}</td><td>${esc(e.home || e.away || "")}</td></tr>`).join("")}</table></details></div>`;
    state._hbDraft = d.draft;
  } catch (e) { box.innerHTML = ""; }
}
function useDraft() {
  const t = document.getElementById("rp-text");
  if (!t || !state._hbDraft) return;
  if (t.value.trim() && !confirm("Bisherigen Text durch den Entwurf ersetzen?")) return;
  t.value = state._hbDraft;
  t.scrollIntoView({ behavior: "smooth", block: "center" });
}


async function createPlayerLogins() {
  const el = document.getElementById("logins-result");
  if (!confirm("Für alle Spieler von handball.ch Logins erstellen?")) return;

// Spiel-Details: Team-Vergleich + Spielerstatistik (von handball.ch)
// ---------------------------------------------------------------------
function q(a, b) { return b ? Math.round(100 * a / b) + "%" : "–"; }
async function loadGameStats(gameId) {
  const box = document.getElementById("game-stats");
  if (!box) return;
  try {
    const d = await api(`/handballch/game/${gameId}`);
    if (!d.imported || !d.team_stats) {
      box.innerHTML = (isAdmin() || (state.me && state.me.is_captain)) ? `<div class="card"><h2>📊 Statistik</h2>
        <p class="muted">Für dieses Spiel sind noch keine Daten von handball.ch geholt.</p>
        <button class="btn secondary" onclick="hbImportForGame(${gameId}).then(()=>{})">📥 Von handball.ch holen</button><div id="rp-result"></div></div>` : "";
      box.innerHTML += analysisHtml(null);
      return;
    }
    const u = d.team_stats.us, t = d.team_stats.them;
    const row = (label, a, b, better) => {
      const hiA = better === "hi" ? a.v > b.v : better === "lo" ? a.v < b.v : false;
      const hiB = better === "hi" ? b.v > a.v : better === "lo" ? b.v < a.v : false;
      return `<tr><td style="text-align:right" class="${hiA ? "win" : ""}">${a.s}</td><td style="text-align:center" class="muted">${label}</td><td class="${hiB ? "win" : ""}">${b.s}</td></tr>`;
    };
    const n = (v) => ({ v, s: v });
    const wq = (s) => ({ v: s.wuerfe ? s.wurf_tore / s.wuerfe : 0, s: `${q(s.wurf_tore, s.wuerfe)} <span class="muted">(${s.wurf_tore}/${s.wuerfe})</span>` });
    const sv = (s) => ({ v: s.siebenm_versuche ? s.siebenm_tore / s.siebenm_versuche : 0, s: s.siebenm_versuche ? `${s.siebenm_tore}/${s.siebenm_versuche}` : "–" });
    const gk = (s) => ({ v: s.schuesse_aufs_tor ? s.paraden / s.schuesse_aufs_tor : 0, s: s.schuesse_aufs_tor ? `${q(s.paraden, s.schuesse_aufs_tor)} <span class="muted">(${s.paraden}/${s.schuesse_aufs_tor})</span>` : "–" });
    let html = `<div class="card"><h2>📊 Statistik</h2>
      <table class="cmp"><tr><th style="text-align:right">${esc(d.team || "Wir")}</th><th></th><th>${esc(d.opponent || "Gegner")}</th></tr>
        ${row("Tore", n(u.tore), n(t.tore), "hi")}
        ${row("Würfe", n(u.wuerfe), n(t.wuerfe))}
        ${row("Wurfquote", wq(u), wq(t), "hi")}
        ${row("7m", sv(u), sv(t), "hi")}
        ${row("Techn. Fehler", n(u.tf), n(t.tf), "lo")}
        ${row("Torhüter", gk(u), gk(t), "hi")}
        ${row("2 Min.", n(u.zwei_min), n(t.zwei_min), "lo")}
        ${row("Verwarnungen", n(u.gelb), n(t.gelb), "lo")}
        ${row("Rote Karten", n(u.rot), n(t.rot), "lo")}
      </table>
      ${d.half_us != null ? `<p class="muted" style="text-align:center">Halbzeit ${d.half_us}:${d.half_them}</p>` : ""}
    </div>`;
    const field = (d.players || []).filter(p => !p.paraden || p.tore);
    const keepers = (d.players || []).filter(p => p.paraden);
    html += `<div class="card"><h2>👥 Unsere Spieler</h2><div style="overflow-x:auto"><table>
      <tr><th>#</th><th>Spieler</th><th>Tore</th><th>%</th><th>7m</th><th>TF</th><th>2'</th><th>🟨</th><th>🟥</th></tr>
      ${field.sort((a, b) => b.tore - a.tore).map(p => {
        const [wt, wv] = (p.wuerfe || "").split("/").map(Number);
        return `<tr class="clickable" onclick="state.tab='statistik';openStatPlayer('${encodeURIComponent(p.name)}');renderTabs()">
          <td class="muted">${p.nr ?? ""}</td><td>${esc(p.name)}</td><td><strong>${p.tore}</strong>${p.wuerfe ? `<span class="muted">/${wv}</span>` : ""}</td>
          <td>${wv ? Math.round(100 * wt / wv) + "%" : "–"}</td><td>${esc(p.siebenm || "–")}</td><td>${p.tf || "–"}</td>
          <td>${p.zwei_min || "–"}</td><td>${p.gelb || "–"}</td><td>${p.rot || "–"}</td></tr>`;
      }).join("")}</table></div>
      ${keepers.length ? `<h3>🧤 Torhüter</h3><table><tr><th>#</th><th>Torhüter</th><th>Paraden</th><th>Quote</th></tr>
        ${keepers.map(p => { const [a, b] = p.paraden.split("/").map(Number); return `<tr><td class="muted">${p.nr ?? ""}</td><td>${esc(p.name)}</td><td><strong>${a}</strong>/${b}</td><td>${b ? Math.round(100 * a / b) + "%" : "–"}</td></tr>`; }).join("")}</table>` : ""}
      <p class="muted"><a href="https://www.handball.ch/de/matchcenter/spiele/${d.hb_game_id}" target="_blank" rel="noopener">Spiel auf handball.ch</a></p></div>`;
    html += analysisHtml(d.analysis);
    box.innerHTML = html;
  } catch (e) { box.innerHTML = ""; }
}

const IS_ANDROID = /android/i.test(navigator.userAgent);
function isStandalone() { return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; }
function pushSupported() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }

async function registerSW() {
  if (!("serviceWorker" in navigator)) return null;
  try {
    const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/" });
    navigator.serviceWorker.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "open") handleOpenUrl(ev.data.url);
      if (ev.data && ev.data.type === "resubscribe") syncPushSubscription(true);
    });
    return reg;
  } catch (e) { return null; }
}
const _swReady = registerSW();

function urlB64ToUint8(b64) {
  const pad = "=".repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(ch => ch.charCodeAt(0)));
}
async function currentSubscription() {
  if (!pushSupported()) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function postSubscription(sub) {
  const j = sub.toJSON();
  return api("/push/subscribe", { method: "POST", body: JSON.stringify({ endpoint: j.endpoint, keys: j.keys, user_agent: navigator.userAgent }) });
}
// Beim Start: vorhandenes Abo dem eingeloggten Spieler zuordnen (oder erneuern)
async function syncPushSubscription(force) {
  try {
    if (!pushSupported() || Notification.permission !== "granted" || !state.token) return;
    let sub = await currentSubscription();
    if (!sub || force) {
      const { key } = await api("/push/public-key");
      const reg = await navigator.serviceWorker.ready;
      sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(key) });
    }
    await postSubscription(sub);
  } catch (e) { /* ignore */ }
}
async function enablePush() {
  const out = document.getElementById("push-msg");
  const say = (h) => { if (out) out.innerHTML = h; };
  try {
    if (!pushSupported()) { say('<p class="error">Dieser Browser kann keine Benachrichtigungen. ' + (IS_IOS ? "Auf dem iPhone zuerst die App zum Home-Bildschirm hinzufügen und von dort öffnen." : "Bitte Chrome, Safari oder Edge verwenden.") + "</p>"); return; }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { say('<p class="error">Benachrichtigungen wurden nicht erlaubt. Du kannst das in den Einstellungen des Handys für diese App wieder einschalten.</p>'); return; }
    await _swReady;
    const { key } = await api("/push/public-key");
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8(key) });
    await postSubscription(sub);
    say('<p class="ok">✅ Benachrichtigungen sind aktiv. Zum Ausprobieren auf „Test senden“ tippen.</p>');
    loadAppSetup(true);
  } catch (e) { say(`<p class="error">${esc(e.message || String(e))}</p>`); }
}

  try {
    const sub = await currentSubscription();
    if (sub) { await api("/push/unsubscribe", { method: "POST", body: JSON.stringify({ endpoint: sub.endpoint }) }); await sub.unsubscribe(); }
    loadAppSetup();
  } catch (e) { alert(e.message); }

function handleOpenUrl(url) {
  try {

    if (!v || !state.me) return;
    const [kind, id] = v.split(":");
    const n = parseInt(id);
    if (kind === "game") openGame(n);
    else if (kind === "event") openEvent(n);
    else if (kind === "report") openReport(n);
    else if (kind === "chat") openChat(n);
    else if (kind === "tile") { if (id === "einstellungen") goToEinstellungen(); else openTile(id); }
    else if (kind === "tab") { state.tab = id; renderTabs(); renderTab(); }
    history.replaceState(null, "", "/");
  } catch (e) { /* ignore */ }
}

(function initSwipe() {
  const TH = 80;
  let cur = null;
  document.addEventListener("touchstart", (e) => {
    const w = e.target.closest(".swipe-wrap");
    if (!w || e.touches.length > 1) { cur = null; return; }
    const t = e.touches[0];
    cur = { w, row: w.querySelector(".game-item"), x: t.clientX, y: t.clientY, dx: 0, lock: null };
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!cur) return;
    const t = e.touches[0];
    const dx = t.clientX - cur.x, dy = t.clientY - cur.y;
    if (cur.lock === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) cur.lock = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (cur.lock !== "x") return;
    if (e.cancelable) e.preventDefault();
    cur.dx = Math.max(-160, Math.min(160, dx));
    cur.w.classList.add("dragging");
    cur.w.classList.toggle("to-yes", cur.dx > 0);
    cur.w.classList.toggle("to-no", cur.dx < 0);
    cur.row.style.transform = `translateX(${cur.dx}px)`;
  }, { passive: false });
  document.addEventListener("touchend", () => {
    if (!cur) return;
    const c = cur; cur = null;
    c.w.classList.remove("dragging");
    if (c.lock === "x") { window._swiped = true; setTimeout(() => { window._swiped = false; }, 350); }
    if (Math.abs(c.dx) >= TH) {
      const yes = c.dx > 0;
      c.row.style.transform = `translateX(${yes ? 110 : -110}%)`;
      if (navigator.vibrate) navigator.vibrate(15);
      const id = parseInt(c.w.dataset.id);
      setTimeout(() => {
        if (c.w.dataset.kind === "game") setAvailability(id, yes ? "kann_spielen" : "abwesend");
        else setResponse(id, yes ? "zusage" : "absage").then(() => { c.row.style.transform = ""; c.w.classList.remove("to-yes", "to-no"); });
      }, 180);
    } else {
      c.row.style.transform = "";
      setTimeout(() => c.w.classList.remove("to-yes", "to-no"), 200);
    }
  });
})();

// Spielanalyse aus dem Liveticker
// ---------------------------------------------------------------------
function analysisHtml(a) {
  if (!a) return `<div class="card"><h2>🔎 Spielanalyse</h2><p class="muted">Kein Live Ticker vorhanden.</p></div>`;
  const maxG = Math.max(1, ...a.phases.map(p => Math.max(p.us, p.them)));
  const bar = (n, cls) => `<span style="display:inline-block;height:9px;border-radius:5px;width:${Math.round(56 * n / maxG)}px;background:var(${cls});vertical-align:middle"></span>`;
  let h = `<div class="card"><h2>🔎 Spielanalyse</h2>
    <h3>⏱️ Tore pro 10 Minuten</h3>
    <table><tr><th>Minute</th><th style="text-align:right">Wir</th><th></th><th>Gegner</th><th style="text-align:right">Stand</th></tr>
    ${a.phases.map(p => {
      const cls = p.us > p.them ? "win" : "";
      return `<tr><td class="muted">${p.from}–${p.to}'</td><td style="text-align:right" class="${cls}"><strong>${p.us}</strong> ${bar(p.us, "--green")}</td>
        <td></td><td>${bar(p.them, "--red")} ${p.them}</td><td style="text-align:right">${p.score}</td></tr>`; }).join("")}</table>`;
  // Läufe
  h += `<h3>🔥 Läufe</h3>`;
  h += a.runs.length ? a.runs.map(r => `<div class="list-item" style="padding:6px 0">
      <span style="font-size:1.2rem">${r.side === "wir" ? "🟢" : "🔴"}</span>
      <div class="grow"><strong>${r.side === "wir" ? r.n + ":0" : "0:" + r.n}-Lauf</strong> ${r.side === "wir" ? "von uns" : "vom Gegner"}
      <div class="game-meta">Minute ${r.from}–${r.to} · ${r.score_before} → ${r.score_after}</div></div></div>`).join("")
    : `<p class="muted">Keine Läufe mit 3 oder mehr Toren am Stück.</p>`;
  // Über-/Unterzahl
  const S = a.situations, lab = { gleichzahl: "⚖️ Gleichzahl", ueberzahl: "➕ Überzahl", unterzahl: "➖ Unterzahl" };
  h += `<h3>👥 Über- und Unterzahl</h3>
    <table><tr><th></th><th style="text-align:right">Zeit</th><th style="text-align:right">Tore</th><th style="text-align:right">Bilanz</th></tr>
    ${["gleichzahl", "ueberzahl", "unterzahl"].map(k => { const v = S[k]; const d = v.us - v.them;
      return `<tr><td>${lab[k]}</td><td style="text-align:right" class="muted">${v.min} Min.</td><td style="text-align:right">${v.us}:${v.them}</td>
        <td style="text-align:right;${d < 0 ? "color:var(--red)" : ""}" class="${d > 0 ? "win" : ""}">${d > 0 ? "+" : ""}${d}</td></tr>`; }).join("")}</table>
    <p class="muted" style="margin:4px 0 0">Zeitstrafen: wir ${a.penalties_us}, Gegner ${a.penalties_them} · 7m-Tore: wir ${a.seven_us}, Gegner ${a.seven_them}</p>`;
  // Schlussphase
  const f = a.finale;
  h += `<h3>🏁 Schlussphase (ab Minute ${f.from})</h3>
    <p>Teilresultat <strong>${f.us}:${f.them}</strong> · ${f.score_before} → <strong>${f.score_after}</strong></p>
    ${f.goals.length ? `<p class="muted" style="margin:0 0 4px">Unsere Tore:</p>${f.goals.map(g => `<div class="row" style="padding:2px 0"><span>${esc(g.name)}${g.seven ? " (7m)" : ""}</span><span class="muted">${g.time}</span></div>`).join("")}`
      : `<p class="muted">In den letzten 10 Minuten keine Tore von uns.</p>`}`;
  // Führung & Timeouts
  h += `<h3>📈 Spielverlauf</h3><p>Führungswechsel: <strong>${a.lead_changes}</strong>`
    + (a.max_lead ? ` · höchste Führung <strong>+${a.max_lead.goals}</strong> (${a.max_lead.time})` : "")
    + (a.max_back ? ` · grösster Rückstand <strong>−${a.max_back.goals}</strong> (${a.max_back.time})` : "") + `</p>`;
  if (a.timeouts.length) {
    h += `<p class="muted" style="margin:0 0 4px">Time-Outs (Tore in den 5 Minuten danach):</p>` + a.timeouts.map(t =>
      `<div class="row" style="padding:2px 0"><span>⏸️ ${t.time}${t.side ? (t.side === "wir" ? " · unser Time-Out" : " · Gegner") : ""} · Stand ${t.score}</span><span>${t.next5_us}:${t.next5_them}</span></div>`).join("");
  }
  return h + `</div>`;
}

const AV_COLORS = ["#ef4444", "#f97316", "#d97706", "#16a34a", "#0d9488", "#0284c7", "#4f46e5", "#9333ea", "#db2777", "#475569"];
function avatarHtml(name, kind, sm, url, online) {
  const cls = `avatar ${sm ? "sm" : ""}`;
  const dot = online ? '<i class="on-dot"></i>' : "";
  if (kind === "team") return `<div class="${cls}" style="background:#1d4ed8">📢</div>`;
  if (kind === "players") return `<div class="${cls}" style="background:#16a34a">👥</div>`;
  if (url) return `<div class="${cls}" style="background:#cbd5e1"><img src="${url}" alt="" loading="lazy">${dot}</div>`;
  const parts = (name || "?").split(" ").filter(Boolean);
  const ini = ((parts[0] || "?")[0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  return `<div class="${cls}" style="background:${nameColor(name)}">${esc(ini)}${dot}</div>`;
}
function nameColor(name) { let h = 0; for (const ch of name || "") h = (h * 31 + ch.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function linkify(t) { return esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function chatTime(iso) { return new Date(iso).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }); }
function chatDay(iso) {
  const d = new Date(iso), t = new Date(); const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Heute";
  if (d.toDateString() === y.toDateString()) return "Gestern";
  return d.toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" });
}
function listTime(iso) {
  if (!iso) return "";
  const d = new Date(iso), t = new Date();
  if (d.toDateString() === t.toDateString()) return chatTime(iso);
  const y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "Gestern";
  return d.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit" });
}
function fullWhen(iso) {
  if (!iso) return "–";
  const day = chatDay(iso);
  return `${day === "Heute" || day === "Gestern" ? day : new Date(iso).toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" })}, ${chatTime(iso)}`;
}
function lastSeenText(p) {
  if (!p) return "";
  if (p.online) return "online";
  if (!p.last_seen) return "";
  const day = chatDay(p.last_seen);
  return `zuletzt online ${day === "Heute" ? "heute" : day === "Gestern" ? "gestern" : "am " + new Date(p.last_seen).toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit" })} um ${chatTime(p.last_seen)}`;
}
// Haken wie WhatsApp: ✓ gesendet · ✓✓ zugestellt · blaue ✓✓ gelesen
const TICK_SVG = (two) => `<svg viewBox="0 0 18 11" width="16" height="11"><path d="M1 5.6l3.3 3.3L11 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>${two ? '<path d="M7 8.9l.6.6L14.4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' : ""}</svg>`;
function tickHtml(status) {
  if (!status) return "";
  if (status === "pending") return '<span class="tick">🕓</span>';
  return `<span class="tick ${status === "read" ? "read" : ""}">${TICK_SVG(status !== "sent")}</span>`;
}
function statusFrom(m, cur) {
  if (!m.mine) return null;
  if (!cur) return m.status || "sent";
  if (cur.read && m.id <= cur.read) return "read";
  if (cur.delivered && m.id <= cur.delivered) return "delivered";
  return "sent";
}

function openChat(roomId) {

function stopChatPolling() { if (window._chatPoll) { clearInterval(window._chatPoll); window._chatPoll = null; } }

async function renderChat() {

async function resizeImage(file, max) {
  // Vorab im Browser verkleinern (schneller Upload); der Server entfernt zusätzlich alle Metadaten (GPS).
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
async function uploadAvatar(input) {
  if (!input.files.length) return;

// ---------- Chat-Raum ----------
function replyQuoteHtml(r, inBubble) {
  if (!r) return "";
  const me = state.me && r.user_id === state.me.id;
  return `<div class="rq" ${inBubble ? `onclick="event.stopPropagation();jumpToMsg(${r.id})"` : ""} style="border-left-color:${me ? "var(--wa-green)" : nameColor(r.name)}">
    <b style="color:${me ? "var(--wa-green)" : nameColor(r.name)}">${me ? "Du" : esc(r.name)}</b><span>${esc(r.text || "")}</span></div>`;
}
function bubbleHtml(m, room, prev) {
  const first = !prev || prev.user_id !== m.user_id || (new Date(m.created_at) - new Date(prev.created_at)) > 5 * 60e3;
  const showName = room.kind !== "dm" && !m.mine && first;
  const st = m.pending ? "pending" : statusFrom(m, state._chat.cursors);
  const meta = `<span class="meta">${chatTime(m.created_at)}${m.mine ? tickHtml(st) : ""}</span>`;
  const who = showName ? `<span class="who" style="color:${nameColor(m.name)}">${esc(m.name)}</span>` : "";
  let inner;
  if (m.deleted) inner = `<div class="bubble deleted">🚫 ${m.mine ? "Du hast diese Nachricht gelöscht" : "Diese Nachricht wurde gelöscht"}${meta}</div>`;
  else if (m.kind === "poll") inner = `<div class="bubble" style="min-width:240px">${who}${pollHtml(m)}${meta}</div>`;
  else if (m.kind === "image") {
    const w = m.image ? Math.min(250, m.image.w || 250) : 250, h = m.image && m.image.w ? Math.round(w * m.image.h / m.image.w) : 180;
    inner = `<div class="bubble img">${who}${replyQuoteHtml(m.reply, true)}
      ${m.image ? `<img class="chat-img" src="${m.image.url}" style="width:${w}px;height:${h}px" onclick="event.stopPropagation();viewImage('${m.image.url}')" alt="Foto">` : `<div class="chat-img" style="width:${w}px;height:${h}px;display:flex;align-items:center;justify-content:center">⏳</div>`}
      ${m.text ? `<div class="cap">${linkify(m.text)}${meta}</div>` : `<span class="meta on-img">${chatTime(m.created_at)}${m.mine ? tickHtml(st) : ""}</span>`}</div>`;
  }
  else inner = `<div class="bubble">${who}${replyQuoteHtml(m.reply, true)}${linkify(m.text || "")}${meta}</div>`;
  return `<div class="msg ${m.mine ? "mine" : "theirs"} ${first ? "first" : ""}" id="msg-${m.id}" data-id="${m.id}"><span class="swipe-ico">↩︎</span>${inner}</div>`;
}
function pollHtml(m) {
  const p = m.poll, max = Math.max(1, ...p.options.map(o => o.votes));
  return `<div class="poll-q">📊 ${esc(m.text)}</div><div class="poll-hint">${p.multiple ? "Mehrere Antworten möglich" : "Eine Antwort wählen"} · ${p.voters} ${p.voters === 1 ? "Stimme" : "Stimmen"}</div>
    ${p.options.map(o => `<div class="poll-opt" onclick="votePoll(${m.id},${o.id},${p.multiple})">
        <span class="ck ${p.multiple ? "sq" : ""} ${o.mine ? "on" : ""}">${o.mine ? "✓" : ""}</span>
        <div class="ptxt">${esc(o.text)}<div class="pbar"><i style="width:${Math.round(100 * o.votes / max)}%"></i></div></div>
        <span class="pn">${o.votes}</span></div>
      ${o.who.length ? `<div class="poll-who">${o.who.map(esc).join(", ")}</div>` : ""}`).join("")}`.replace(/>\s+</g, "><");
}

function renderMessages() {
  const box = document.getElementById("chat-msgs");
  if (!box) return;
  const ms = state._chat.msgs, room = state._chat.room;
  let html = state._chat.hasMore ? `<div style="text-align:center;margin:6px 0"><button class="btn small secondary" onclick="loadOlder()">Ältere Nachrichten laden</button></div>` : "";
  if (!ms.length) html += `<div class="daychip"><span>${room.kind === "team" ? "Hier schreiben die Trainer Infos und machen Umfragen." : "Noch keine Nachrichten – schreib die erste!"}</span></div>`;
  let lastDay = "";
  ms.forEach((m, i) => {
    const day = chatDay(m.created_at);
    if (day !== lastDay) { html += `<div class="daychip"><span>${day}</span></div>`; lastDay = day; }
    html += bubbleHtml(m, room, i && chatDay(ms[i - 1].created_at) === day ? ms[i - 1] : null);
  });
  box.innerHTML = html;
}
function nearBottom() { return window.innerHeight + window.scrollY >= document.body.scrollHeight - 160; }
function scrollChatBottom() { window.scrollTo(0, document.body.scrollHeight); }
function jumpToMsg(id) {
  const el = document.getElementById("msg-" + id);

}

function chatSubtitle() {
  const ch = state._chat, r = ch.room;
  if (ch.typing && ch.typing.length) {

// Wischen wie WhatsApp: nach rechts = antworten, nach links (eigene Nachricht) = Info.

function attachSwipe(box) {
  if (!box || box._swipe) return;
  box._swipe = true;
  let s = null;
  box.addEventListener("touchstart", e => {
    const msg = e.target.closest(".msg"); if (!msg || e.touches.length !== 1) return;
    s = { msg, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: null };
    s.timer = setTimeout(() => { if (s && !s.lock) { s.lock = "press"; navigator.vibrate && navigator.vibrate(15); msgActions(Number(msg.dataset.id)); } }, 550);
  }, { passive: true });
  box.addEventListener("touchmove", e => {
    if (!s) return;
    const dx = e.touches[0].clientX - s.x, dy = e.touches[0].clientY - s.y;
    if (!s.lock) {
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) { clearTimeout(s.timer); s.lock = Math.abs(dx) > Math.abs(dy) * 1.3 ? "x" : "y"; }
    }
    if (s.lock !== "x") return;
    s.dx = Math.max(-90, Math.min(90, dx));
    const m = state._chat.msgs.find(x => x.id === Number(s.msg.dataset.id));
    if (s.dx < 0 && !(m && m.mine && !m.deleted)) s.dx = 0;   // Info gibt es nur für eigene Nachrichten
    s.msg.style.transform = `translateX(${s.dx}px)`;
    s.msg.classList.toggle("sw-r", s.dx > 50); s.msg.classList.toggle("sw-l", s.dx < -50);
  }, { passive: true });
  const end = () => {
    if (!s) return;
    clearTimeout(s.timer);
    const id = Number(s.msg.dataset.id), dx = s.dx;
    s.msg.style.transition = "transform .18s"; s.msg.style.transform = "";
    const el = s.msg; setTimeout(() => { el.style.transition = ""; el.classList.remove("sw-r", "sw-l"); }, 200);
    s = null;
    if (dx > 50) startReply(id); else if (dx < -50) msgInfo(id);
  };
  box.addEventListener("touchend", end); box.addEventListener("touchcancel", end);
  box.addEventListener("contextmenu", e => { const msg = e.target.closest(".msg"); if (msg) { e.preventDefault(); msgActions(Number(msg.dataset.id)); } });
}

async function pollChat() {
  if (state.tab !== "chat" || !state.chatRoom || !state._chat) return stopChatPolling();
  if (document.hidden) return;
  const ch = state._chat;
  const real = ch.msgs.filter(m => !m.pending);
  const last = real.length ? real[real.length - 1].id : 0;
  try {
    ch.tick = (ch.tick || 0) + 1;
    const d = await api(`/chat/rooms/${ch.id}/messages?after=${last}${ch.tick % 5 === 0 ? "&polls=1" : ""}`);
    let changed = false;
    if (d.messages.length) { ch.msgs.push(...d.messages.filter(m => !ch.msgs.some(x => x.id === m.id))); changed = true; }
    d.updated_polls.forEach(p => { const i = ch.msgs.findIndex(x => x.id === p.id); if (i >= 0 && JSON.stringify(ch.msgs[i]) !== JSON.stringify(p)) { ch.msgs[i] = p; changed = true; } });
    (d.deleted_ids || []).forEach(id => { const m = ch.msgs.find(x => x.id === id); if (m && !m.deleted) { m.deleted = true; m.text = null; changed = true; } });
    if (JSON.stringify(d.cursors) !== JSON.stringify(ch.cursors)) { ch.cursors = d.cursors; changed = true; }
    const headOld = JSON.stringify([ch.typing, ch.presence]);
    ch.typing = d.typing; ch.presence = d.presence;
    if (JSON.stringify([ch.typing, ch.presence]) !== headOld) updateChatHead();
    if (changed) { const stick = nearBottom(); renderMessages(); if (stick) scrollChatBottom(); if (d.messages.length) markChatRead(); }
  } catch (e) { /* ignore */ }
}
async function markChatRead() {
  const ch = state._chat; if (!ch || !ch.msgs.length || document.hidden) return;
  const real = ch.msgs.filter(m => !m.pending); if (!real.length) return;
  try { await api(`/chat/rooms/${ch.id}/read`, { method: "POST", body: JSON.stringify({ last_id: real[real.length - 1].id }) }); loadChatBadge(); } catch (e) { /* ignore */ }
}

let _tmpId = -1;
async function sendChat() {
  const ta = document.getElementById("chat-text"); const text = ta.value.trim(); if (!text) return;
  ta.value = ""; ta.style.height = "auto"; ta.focus();
  const reply = state._reply && state._reply.room === state._chat.id ? state._reply : null;
  state._reply = null; renderReplyBar();
  // sofort anzeigen (mit Uhr-Symbol), wie WhatsApp
  const tmp = { id: _tmpId--, user_id: state.me.id, name: state.me.name, mine: true, kind: "text", text, created_at: new Date().toISOString(), pending: true,
                reply: reply ? { id: reply.id, user_id: reply.user_id, name: reply.name, text: reply.text } : null };
  state._chat.msgs.push(tmp); renderMessages(); scrollChatBottom();
  try {
    const m = await api(`/chat/rooms/${state._chat.id}/messages`, { method: "POST", body: JSON.stringify({ text, reply_to_id: reply ? reply.id : null }) });
    const ms = state._chat.msgs; ms.splice(ms.indexOf(tmp), 1);
    if (!ms.some(x => x.id === m.id)) ms.push(m);
    ms.sort((a, b) => (a.pending ? 1e12 : a.id) - (b.pending ? 1e12 : b.id));
    renderMessages(); scrollChatBottom();
  } catch (e) { const ms = state._chat.msgs; ms.splice(ms.indexOf(tmp), 1); renderMessages(); alert(e.message); ta.value = text; }
}
async function sendChatImage(input) {

  state._chat.msgs.push(tmp); renderMessages(); scrollChatBottom();

}

const ST = {

  unbekannt: { c: "s-open", t: "Offen", i: "?" },
};
const ST_ORDER = ["zusage", "kann_spielen", "individuell", "verletzt", "absage", "abwesend", "unbekannt"];
const ST_VAR = { "s-yes": "--st-yes", "s-no": "--st-no", "s-inj": "--st-inj", "s-ind": "--st-ind", "s-open": "--st-open" };
function stCounts(list) { const c = {}; list.forEach(p => { const k = ST[p.status] ? p.status : "unbekannt"; c[k] = (c[k] || 0) + 1; }); return c; }
function stBarHtml(counts, total) {
  total = total || Object.values(counts).reduce((a, b) => a + b, 0) || 1;
  return `<div class="stbar">${ST_ORDER.filter(k => counts[k] && k !== "unbekannt").map(k =>
    `<i style="width:${100 * counts[k] / total}%;background:var(${ST_VAR[ST[k].c]})" title="${ST[k].t}: ${counts[k]}"></i>`).join("")}</div>`;
}
function stChipsHtml(counts) {

}
function stTableHtml(list, withReason) {
  const rows = list.slice().sort((a, b) => ST_ORDER.indexOf(ST[a.status] ? a.status : "unbekannt") - ST_ORDER.indexOf(ST[b.status] ? b.status : "unbekannt") || a.name.localeCompare(b.name));
  return `<table class="att">${rows.map(p => { const s = ST[p.status] || ST.unbekannt;
    return `<tr class="${s.c}"><td>${esc(p.name)}${withReason && p.reason ? `<span class="why">„${esc(p.reason)}“</span>` : ""}</td><td>${!withReason && p.has_reason ? "💬 " : ""}${s.i} ${s.t}</td></tr>`; }).join("")}</table>`;

function startHeroHtml(items) {
  const first = ((state.me && state.me.name) || "").split(" ")[0];
  const h = new Date().getHours();
  const hi = h < 11 ? "Guete Morge" : h < 17 ? "Hoi" : "Guete Abig";
  const open = items.filter(it => !it.is_cancelled && (!it.my_status || it.my_status === "unbekannt")).length;
  const next = items.find(it => !it.is_cancelled);
  const games = items.filter(it => it.ref_kind === "game").length;
  const firstOpen = items.findIndex(it => !it.is_cancelled && (!it.my_status || it.my_status === "unbekannt"));
  return `<div class="hero"><h2>${hi} ${esc(first)} 👋</h2>
    <p>${next ? `Als Nächstes: <strong>${esc(next.title)}</strong> – ${relDay(next.start_time).toLowerCase()} um ${fmtTime(next.start_time)}` : "Gerade ist nichts geplant."}</p>
    <div class="hchips">
      ${open ? `<span class="hchip warn" onclick="slideTo(${firstOpen})">⏳ ${open} noch nicht eingetragen</span>` : `<span class="hchip">✅ Überall eingetragen</span>`}
      <span class="hchip" onclick="switchTab('spiele')">🤾 ${games} Spiel${games === 1 ? "" : "e"} in 4 Wochen</span>
      <span class="hchip" onclick="switchTab('chat')">💬 Chat</span>
    </div></div>`;
}

// Datenschutz-Hinweis (einmal pro Gerät). Die App setzt keine Cookies, nur technisch nötige Speicherung.
function showPrivacyNotice() {
  let seen = null; try { seen = localStorage.getItem("privacyOk"); } catch (e) { /* ignore */ }
  if (seen || document.getElementById("privacy-bar")) return;
  const d = document.createElement("div");
  d.id = "privacy-bar"; d.className = "privacy-bar";
  d.innerHTML = `🍪 <strong>Keine Tracking-Cookies.</strong> Diese App speichert auf deinem Gerät nur, was sie zum Funktionieren braucht (Anmeldung, Design, Offline-Start). Keine Werbung, keine Analyse.
    <div class="row2"><button class="more" onclick="location.href='/datenschutz'">Datenschutz lesen</button>
    <button class="ok" onclick="try{localStorage.setItem('privacyOk','1')}catch(e){};this.closest('.privacy-bar').remove()">Verstanden</button></div>`;
  document.body.appendChild(d);
  const login = document.getElementById("login-screen");
  if (login && !login.classList.contains("hidden")) d.style.bottom = "calc(14px + env(safe-area-inset-bottom))";
}

// ---------------------------------------------------------------------
// Terminplan wie bei Gump: Zeilen = Spieler, Spalten = Termine, Felder farbig
// ---------------------------------------------------------------------
const GP_CLS = { zusage: "c-yes", kann_spielen: "c-yes", absage: "c-no", abwesend: "c-no", verletzt: "c-inj", individuell: "c-ind" };
const GP_AV = ["#2563eb", "#16a34a", "#dc2626", "#7c3aed", "#d97706", "#0891b2", "#db2777", "#4b5563"];
function gpAvatar(name, url) { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  if (url) return `<span class="gp-av" style="background:#cbd5e1"><img src="${url}" alt="" loading="lazy"></span>`;
  return `<span class="gp-av" style="background:${GP_AV[h % GP_AV.length]}">${esc((name.trim()[0] || "?").toUpperCase())}</span>`; }
function openSheet(html) {
  closeSheet();
  const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet-bg";
  bg.onclick = ev => { if (ev.target === bg) closeSheet(); };
  bg.innerHTML = `<div class="sheet"><div class="grip"></div>${html}</div>`;
  document.body.appendChild(bg);
}
function closeSheet() { const b = document.getElementById("sheet-bg"); if (b) b.remove(); }

async function renderTerminplan() {
  const box = document.getElementById("gp-box");
  try {
    const d = await api("/terminplan?days=35");
    const f = state.termFilter || "alle";
    const idx = [];
    d.columns.forEach((col, i) => { if (f === "alle" || col.kind === f || (f === "event" && col.kind === "sitzung")) idx.push(i); });
    state._gp = d;
    if (!idx.length) { box.innerHTML = '<div class="card"><p class="muted">In den nächsten 5 Wochen ist nichts geplant.</p></div>'; return; }
    const head = idx.map(i => { const col = d.columns[i]; const k = col.ref_kind === "game" ? KIND_INFO.spiel : (KIND_INFO[col.kind] || KIND_INFO.event);
      const dt = new Date(col.start_time);
      const date = dt.toLocaleDateString("de-CH", { weekday: "short" }).toUpperCase().replace(".", "") + ", " + dt.toLocaleDateString("de-CH", { day: "2-digit", month: "2-digit", year: "numeric" });
      const yes = (col.counts.zusage || 0) + (col.counts.kann_spielen || 0), no = (col.counts.absage || 0) + (col.counts.abwesend || 0);
      const title = col.ref_kind === "game" ? `${col.is_home ? "🏠" : col.is_home === false ? "🚌" : ""} ${esc(col.title)}` : esc(col.title);
      return `<th><div class="gp-head ${col.is_cancelled ? "cancel" : k.cls}" onclick="${col.ref_kind === "game" ? `openGame(${col.id})` : `openEvent(${col.id})`}">
        <span class="gp-tag">${k.label}</span><div class="gp-title">${col.is_cancelled ? "<s>" + title + "</s><br>fällt aus" : title}</div>
        <div class="gp-date">${date}<br>${fmtTime(col.start_time)}${col.end_time ? " – " + fmtTime(col.end_time) : ""}</div>
        <span class="gp-cnt">✓ ${yes} · ✗ ${no}${col.counts.verletzt ? " · ✚ " + col.counts.verletzt : ""}</span></div></th>`; }).join("");
    const rowHtml = (r) => `<tr class="${r.me ? "gp-me" : ""}"><td class="gp-name ${d.can_edit_roles && !r.is_staff ? "clk" : ""}" ${d.can_edit_roles && !r.is_staff ? `onclick="gpRole(${r.user_id})"` : ""}><div class="nm">${gpAvatar(r.name, r.avatar)}<span>${esc(r.name)}${r.me ? " <span class='muted' style='font-weight:600'>(du)</span>" : ""}</span></div></td>
      ${idx.map(i => { const col = d.columns[i], cell = r.cells[i];
        if (col.is_cancelled) return `<td><div class="gp-cell c-x"></div></td>`;
        const cls = GP_CLS[cell.status] || "c-open";
        const tap = r.me || (cell.reason && isAdmin());
        const rs = cell.has_reason && cls !== "c-open";
        return `<td><div class="gp-cell ${cls} ${rs ? "rs" : ""} ${tap ? "tap" : ""}" ${tap ? `onclick="gpTap(${i},${r.user_id})"` : ""}>${rs ? GP_BUBBLE : cell.has_reason ? '<span class="bub">💬</span>' : ""}${cls === "c-open" && r.me ? "?" : ""}</div></td>`; }).join("")}</tr>`;
    const players = d.rows.filter(r => !r.is_staff && !r.is_goalie), goalies = d.rows.filter(r => !r.is_staff && r.is_goalie), staff = d.rows.filter(r => r.is_staff);
    const sep = (label) => `<tr class="gp-sep"><td class="gp-name">${label}</td><td colspan="${idx.length}"></td></tr>`;
    box.innerHTML = (d.can_edit_roles ? `<div class="gp-opts"><span>✅ <strong>Alle automatisch angemeldet</strong><br><span class="muted" style="font-size:.75rem">Wer nichts macht, ist grün (dabei) – abmelden muss man sich selbst.</span></span>
        <span class="switch"><input type="checkbox" ${d.default_in ? "checked" : ""} onchange="gpDefault(this.checked)"><span></span></span></div>` : "")
      + `<div class="gp-legend"><span><i style="background:#43a047"></i>dabei</span><span><i style="background:#d04848"></i>abgemeldet</span>
        <span><i style="background:#f59e0b"></i>verletzt</span><span><i style="background:#8b5cf6"></i>individuell</span><span><i style="background:var(--st-open-bg);box-shadow:inset 0 0 0 1px var(--border)"></i>offen</span>
        <span>💬 = mit Grund</span></div>
      <p class="swipe-hint" style="margin:0 0 6px">👉 ${d.default_in ? "Alle sind automatisch angemeldet – tipp auf dein Feld, um dich abzumelden" : "Tipp auf dein Feld zum Eintragen"} · Tipp auf einen Termin für Details${d.can_edit_roles ? " · Name antippen = Torhüter festlegen" : ""}</p>
      <div class="gp-wrap"><table class="gp"><thead><tr><th class="gp-name"></th>${head}</tr></thead><tbody>
      ${sep("🤾 Feldspieler")}${players.map(rowHtml).join("")}
      ${sep("🧤 Torhüter")}${goalies.length ? goalies.map(rowHtml).join("") : `<tr><td class="gp-name muted" style="font-size:.78rem">${d.can_edit_roles ? "Namen antippen, um einen Torhüter festzulegen" : "–"}</td><td colspan="${idx.length}"></td></tr>`}
      ${staff.length ? sep("🧢 Trainer") + staff.map(rowHtml).join("") : ""}
      </tbody></table></div>`;
  } catch (e) { box.innerHTML = `<div class="card error">${esc(e.message)}</div>`; }
}

function gpTap(i, uid) {
  const d = state._gp; if (!d) return;
  const col = d.columns[i], r = d.rows.find(x => x.user_id === uid), cell = r.cells[i];
  const when = fmtDate(col.start_time);
  const title = `<h3 style="margin:0 0 2px">${esc(col.title)}</h3><p class="muted" style="margin:0 0 10px">${when}</p>`;
  if (!r.me) {
    return openSheet(`${title}<p><strong>${esc(r.name)}</strong>: ${(ST[cell.status] || ST.unbekannt).t}</p>
      ${cell.reason ? `<p class="info-text">💬 ${esc(cell.reason)}</p>` : ""}<button class="btn secondary" onclick="closeSheet()">Schliessen</button>`);
  }
  const btns = col.ref_kind === "game"
    ? availabilityButtonsHtml({ id: col.id, my_availability_status: cell.status })
    : responseButtonsHtml({ id: col.id, kind: col.kind, my_status: cell.status, is_cancelled: col.is_cancelled });
  openSheet(`${title}${cell.reason ? `<p class="muted">Dein Grund: ${esc(cell.reason)}</p>` : ""}
    <div onclick="if(event.target.closest('button'))setTimeout(closeSheet,50)">${btns}</div>
    <button class="btn secondary" style="margin-top:8px" onclick="closeSheet();${col.ref_kind === "game" ? `openGame(${col.id})` : `openEvent(${col.id})`}">Details öffnen ›</button>`);
}

const GP_BUBBLE = '<svg class="rsi" viewBox="0 0 24 24"><path fill="white" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-4.5 3.6c-.4.3-1 .03-1-.48V17H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M7 8.5h10M7 12h7" stroke="rgba(0,0,0,.35)" stroke-width="1.6" stroke-linecap="round"/></svg>';
async function gpDefault(on) {
  if (!on && !confirm("Automatische Anmeldung ausschalten? Die automatischen grünen Felder werden wieder offen (grau).")) { renderTerminplan(); return; }
  try { await api("/terminplan/default", { method: "PUT", body: JSON.stringify({ enabled: on }) }); renderTerminplan(); } catch (e) { alert(e.message); }
}
function gpRole(uid) {
  const r = (state._gp.rows || []).find(x => x.user_id === uid); if (!r) return;
  openSheet(`<h3 style="margin:0 0 4px">${esc(r.name)}</h3><p class="muted" style="margin:0 0 10px">Position im Terminplan</p>
    <div class="act-list">
      <button onclick="gpSetGoalie(${uid}, true)">🧤 Torhüter${r.is_goalie ? " ✓" : ""}</button>
      <button onclick="gpSetGoalie(${uid}, false)">🤾 Feldspieler${!r.is_goalie ? " ✓" : ""}</button>
      <button onclick="gpSetGoalie(${uid}, null)">🔄 Automatisch (aus den Spielstatistiken von handball.ch)</button>
      <button onclick="closeSheet()">Abbrechen</button></div>`);
}
async function gpSetGoalie(uid, goalie) {
  try { await api(`/terminplan/goalie/${uid}`, { method: "PUT", body: JSON.stringify({ goalie }) }); closeSheet(); renderTerminplan(); } catch (e) { alert(e.message); }
}

boot();
showPrivacyNotice();
</script>
</body>
</html>
