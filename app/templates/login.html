<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U19 Handball – Login</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 16px; background: #f5f5f7; }
  h1 { font-size: 1.3rem; }
  input, button { width: 100%; padding: 12px; margin: 6px 0; box-sizing: border-box; font-size: 1rem; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #1d4ed8; color: white; border: none; font-weight: 600; }
  #result { margin-top: 16px; white-space: pre-wrap; font-size: 0.85rem; background: white; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>
  <h1>🤾 U19 Handball – Login</h1>
  <input id="email" type="email" placeholder="E-Mail">
  <input id="password" type="password" placeholder="Passwort">
  <button onclick="login()">Einloggen</button>
  <div id="result"></div>

<script>
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const body = new URLSearchParams();
  body.append('username', email);
  body.append('password', password);

  const res = await fetch('/auth/login', { method: 'POST', body });
  const data = await res.json();
  if (res.ok) {
    localStorage.setItem('token', data.access_token);
    const me = await fetch('/users/me', { headers: { Authorization: 'Bearer ' + data.access_token } });
    document.getElementById('result').textContent = JSON.stringify(await me.json(), null, 2);
  } else {
    document.getElementById('result').textContent = 'Fehler: ' + (data.detail || res.status);
  }
}
</script>
</body>
</html>
